name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Build API
        run: dotnet build ghul-web-api.ghulproj

      - name: Build smoke test
        run: dotnet build tests/smoke-test

      - name: Run smoke test
        run: tests/run-smoke.sh
