name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Build API
        run: dotnet build ghul-web-api.ghulproj

      - name: Build smoke test
        run: dotnet build tests/smoke-test

      - name: Run smoke test
        run: tests/run-smoke.sh

  code_review:
    name: Code review
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: degory/ghul-code-review/.github/workflows/review.yml@v2
    with:
      model: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5' }}
      idle-timeout-seconds: ${{ fromJSON(vars.CLAUDE_REVIEW_IDLE_TIMEOUT_SECONDS || '90') }}
      max-attempts: ${{ fromJSON(vars.CLAUDE_REVIEW_MAX_ATTEMPTS || '3') }}
      gh-app-id: ${{ vars.GHUL_REVIEWER_APP_ID }}
      ghul-reference: true
      prompt: |
        Review pull request #${{ github.event.pull_request.number }} on ${{ github.repository }}.

        You run in parallel with CI. Whether the diff builds and passes tests is gated by CI before merge — that's not your job. Trust the diff as written.

        Read these files first, in order:
        1. .github/claude-review.md — what this repo is, and what to watch for in it
        2. GHUL.md — ghūl language reference (consult as needed while reading the diff)

        Post findings only to GitHub per the brief. Do not put review text in chat messages.
    secrets:
      claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      gh-app-private-key: ${{ secrets.GHUL_REVIEWER_PRIVATE_KEY }}
